<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">Signal knot</title>
  <desc id="desc">An original angular loop built from violet and cyan chart-like facets.</desc>
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcd2ff"/>
      <stop offset=".52" stop-color="#8d6cff"/>
      <stop offset="1" stop-color="#3d2e91"/>
    </linearGradient>
    <linearGradient id="cyan" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9fffb"/>
      <stop offset=".48" stop-color="#66e9e5"/>
      <stop offset="1" stop-color="#176f7b"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#805cff"/>
      <stop offset="1" stop-color="#55e5e2"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="#8f72ff" opacity=".08">
