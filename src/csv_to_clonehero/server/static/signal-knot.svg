    <path d="M302 70 505 122 421 321 274 303Z" fill="url(#violet)"/>
    <path d="M505 122 660 287 476 353 421 321Z" fill="#6c53d6"/>
  </g>
  <g stroke="#9ff8f2" stroke-width="2" stroke-linejoin="round">
    <path d="M660 287 626 519 494 471 476 353Z" fill="url(#cyan)"/>
    <path d="M626 519 444 661 350 487 494 471Z" fill="url(#cyan)"/>
    <path d="M444 661 228 625 350 487Z" fill="#37bfc3"/>
  </g>
  <g stroke="#9fa9e9" stroke-width="2" stroke-linejoin="round">
    <path d="M228 625 89 463 204 394 350 487Z" fill="url(#bridge)"/>
    <path d="M204 394 274 303 421 321 476 353 494 471 350 487Z" fill="#080b20"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M89 463 302 70 660 287 626 519 444 661 228 625 89 463Z" stroke="#d6d0ff" stroke-width="2" opacity=".65"/>
    <path d="m148 180 126 123 28-233m-98 324 70-91 147 18 84-199M350 487l-146-93-115 69m261 24 144-16 132 48m-132-48-18-118 184-66" stroke="#e8e5ff" stroke-width="1.5" opacity=".58"/>
    <path d="M302 70 350 487 660 287M89 463l405 8M228 625l193-304 205 198" stroke="#f5f2e8" stroke-width="1" opacity=".28"/>
  </g>

  <g fill="#f5f2e8">
    <circle cx="302" cy="70" r="4"/>
    <circle cx="660" cy="287" r="4"/>
    <circle cx="626" cy="519" r="4"/>
    <circle cx="228" cy="625" r="4"/>
    <circle cx="89" cy="463" r="4"/>
  </g>
  <g fill="#6debe7" opacity=".7">
