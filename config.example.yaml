# =============================================================================
# CSV to Clone Hero - example configuration (COMMIT-SAFE; contains no secrets)
#
# On first run the app writes a fresh config.yaml next to base config defaults,
# and config.yaml is gitignored. For a production deployment, copy this file to
# config.yaml (or let the app create it) and set all secrets via the
# environment / secret manager instead of editing them here.
#
# Required secrets (see .env.example):
#   SPOTIFY_CLIENT_ID          - public Spotify app client id
#   APP_BASE_URL               - public HTTPS origin of this product
#   SECRET_KEY                 - session signing key (python -m csv_to_clonehero keys)
#   TOKEN_ENCRYPTION_KEY       - Fernet key for per-user refresh tokens
#   NOTIFICATIONS_API_KEY      - optional transactional email provider key
#   GOFUNDME_URL               - optional GoFundMe campaign URL
# =============================================================================

paths:
  input_dir: input_playlists
  output_dir: output_library
  clone_hero_songs_path: ""
  reports_dir: reports
  state_dir: state
  database: state/csv_to_clonehero.db
  catalog: catalog/enchor.jsonl
  artifact_cache_dir: state/export-artifacts
  manifest_dir: state/export-manifests

server:
  # Public HTTPS origin. Also the Spotify OAuth redirect base, so register
  # <origin>/api/auth/spotify/callback in the Spotify Developer Dashboard.
  base_url: ""
  base_url_env: APP_BASE_URL
  enchor_preflight_ttl_seconds: 3600
  max_scope_playlists: 200
  max_scope_tracks: 50000
  # Applied to the final deduplicated Spotify/SoundCloud library before match work.
  max_library_tracks: 50000
  enable_expansion: true
  secret_key_env: SECRET_KEY
  enforce_secret_key: true
  database_url_env: DATABASE_URL
  database_url: ""
  max_content_length: 52428800
  trusted_hops: 1
  session:
    # Compatibility only. The public app reads the top-level sessions block.
    cookie_name: c2ch_session
    cookie_same_site: Lax
    cookie_secure: null
    max_age_seconds: 2592000
    domain: ""

crypto:
  key_env: TOKEN_ENCRYPTION_KEY

sessions:
  cookie_name: c2ch_session
  cookie_same_site: Lax
  cookie_secure: null      # auto-enable over HTTPS
  max_age_seconds: 2592000
  domain: ""

notifications:
  enabled: true
  provider: resend         # resend | smtp | log
  api_key_env: NOTIFICATIONS_API_KEY
  from_address: "noreply@ryo-nd.com"
  smtp_host: ""
  smtp_port: 587
  smtp_user_env: ""
  smtp_password_env: ""
  smtp_use_tls: true

monetization:
  ads_enabled: true
  ad_banner_slot: ""
  ad_sidebar_slot: ""
  gofundme_enabled: true
  gofundme_banner: true
  # Leave empty for the built-in canonical campaign; GOFUNDME_URL overrides it.
  gofundme_url_env: GOFUNDME_URL
  gofundme_url: ""

admin:
  # Legacy single-user CSV/upload UI. Only shown to listed Spotify user ids.
  enable_legacy_csv: false
  admins: []

spotify:
  # Public application id. Leave "" to read SPOTIFY_CLIENT_ID from env.
  client_id: ""
  client_id_env: SPOTIFY_CLIENT_ID
  redirect_port: 8765
  redirect_path: /api/auth/spotify/callback
  public_base_url: ""
  scopes:
    - user-read-private
    - playlist-read-private
    - playlist-read-collaborative
    - user-library-read
  keyring:
    service: csv-to-clonehero.spotify
    user: ""
    username: ""

build:
  dry_run: false
  direct_download_enabled: true

matching:
  auto_accept_threshold: 90.0
  review_threshold: 70.0
  download_review_matches: false
  artist_conflict_threshold: 55.0
  recommendation_threshold: 90.0
  export_floor: 70.0
  duration_tolerance_ms: 5000
  matcher_version: spotify-v1

instruments:
  require_five_fret_guitar: true
  allow_six_fret_only: false
  allow_no_guitar: false
  exclude_modcharts: true

expansion:
  enabled: true
  max_artists_per_batch: 25
  cap_many_songs: 50
  min_songs_many: 5
  cap_some_songs: 25
  cap_one_song: 10
  cap_featured_only: 0
  min_score: 80.0

storage:
  max_library_gib: 48.0
  estimated_chart_bytes: 31457280

network:
  # Enchor rate-limits hard (~1-2 req/s per IP). A public app shares one IP,
  # so keep global concurrency LOW and rely on the adaptive throttle + 7-day
  # cache. Being slow is fine; correctness and completion messaging matter more.
  request_delay_seconds: 0.5
  concurrency: 2
  retries: 3
  timeout_seconds: 30
  cache_ttl_days: 7
  head_size_enabled: false
  download_request_delay: 0.1

cache:
  enabled: true
  ttl_days: 7
  cache_errors: false
  resume: true

scan:
  blocking: true
  resume: true
  persist_progress: true
  retry_failed_queries: true
  status_poll_interval_ms: 1200

search:
  artist_catalog_first: true
  artist_catalog_min_songs: 3
  result_cap: 250
  max_search_pages: 20
  candidate_shortlist_size: 50
  # Local catalog retrieval is intentionally broader than final scoring.
  catalog_artist_fuzzy_limit: 60
  catalog_title_fuzzy_limit: 50
  catalog_min_artist_similarity: 55.0
  catalog_min_title_similarity: 20.0
  catalog_song_key_limit: 12
  catalog_fuzzy_fallback_key_limit: 50
  catalog_candidate_limit: 100

sources:
  enabled: [enchor]

soundcloud:
  enabled: false
  client_id_env: SOUNDCLOUD_CLIENT_ID
  client_secret_env: SOUNDCLOUD_CLIENT_SECRET
  redirect_uri: ""
  redirect_path: /api/auth/soundcloud/callback
  scopes: [non-expiring]
  allow_user_exports: true
  allow_public_playlists: true

export:
  managed_sync: false
  overwrite_owned: true
  include_manifest_in_zip: true
  minimum_free_bytes: 0
  continue_on_error: true
  artifact_retries: 2
  retry_backoff_seconds: 2.0
  download_workers: 3

songs_folder_detection:
  enabled: true
  include_configured_output: true
  include_portable: true
  common_paths:
    - "~/Documents/My Games/Clone Hero/Songs"
    - "~/Documents/My Games/YARG/Songs"
    - "~/AppData/Roaming/YARG/Songs"
    - "~/AppData/Local/YARG/Songs"
    - Songs
  max_candidates: 32

inventory:
  max_files: 100000
  max_depth: 64
  max_file_bytes: 2147483648
  max_total_bytes: 0
  max_metadata_bytes: 1048576
  max_members: 4096
  max_member_bytes: 536870912
  max_archive_bytes: 2147483648
  max_compression_ratio: 10000
  hash_files: false
  poll_interval_ms: 1200

library:
  layout: hybrid

hierarchy:
  root_folder: "00 - His Music"
  exact_section: "Exact Playlist Songs"
  expansion_section: "Artist Expansion"

logging:
  level: INFO
