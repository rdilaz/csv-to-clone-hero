[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-to-clonehero"
version = "0.1.0"
description = "Convert exported Spotify playlist CSVs into a personalized Clone Hero song library"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1.0",
    "rapidfuzz>=3.9,<4.0",
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0",
    "rich>=13.7,<15.0",
    "tenacity>=8.4,<10.0",
    "Flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
csv-to-clonehero = "csv_to_clonehero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit the live Enchor API (skipped by default, run with: pytest -m integration)",
]
addopts = "-m 'not integration'"
