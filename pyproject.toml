[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-to-clonehero"
version = "0.1.0"
description = "Build a personalized Clone Hero or YARG library from music metadata"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27,<1.0",
    "rapidfuzz>=3.9,<4.0",
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0",
    "rich>=13.7,<15.0",
    "tenacity>=8.4,<10.0",
    "Flask>=3.0,<4.0",
    "cryptography>=42.0,<46.0",
    "waitress>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]
browser-e2e = [
    "pytest>=8.0,<9.0",
    "playwright>=1.49,<2.0",
]
gunicorn = [
    "gunicorn>=22.0,<24.0",
]
# The pre-cloud single-user app was the only consumer of keyring; the
# multi-user product stores encrypted tokens in its own datastore instead.
legacy-keyring = [
    "keyring>=25.0,<26.0",
]

[project.scripts]
csv-to-clonehero = "csv_to_clonehero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csv_to_clonehero = ["default_config.yaml", "server/templates/*.html", "templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit the live Enchor API (skipped by default, run with: pytest -m integration)",
    "browser: optional Python Playwright browser coverage",
    "music_ready: browser fixture seed marker",
]
addopts = "-m 'not integration'"
