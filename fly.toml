# Riff, always on, at https://riff.ryo.is
# One machine on purpose: one web process plus one job worker keeps the
# shared Enchor rate budget safe. Do not scale past 1 machine.
app = "riff-ryo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  APP_BASE_URL = "https://riff.ryo.is"
  DATABASE_URL = "sqlite:////data/csv_to_clonehero.db"
  CATALOG_PATH = "/data/catalog/enchor.jsonl"

[[mounts]]
  source = "riff_data"
  destination = "/data"
  initial_size = "30gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
