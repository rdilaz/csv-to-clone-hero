name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Downstream integration checks against the live Enchor API run on a
  # schedule (they are rate-limited and slow, so not on every push).
  schedule:
    - cron: "17 3 * * 2"   # weekly, Tue 03:17 UTC

jobs:
  offline:
    name: Offline suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint compile (syntax/import sanity)
        run: |
          python -m compileall -q src tests
      - name: Build wheel and verify package assets
        run: |
          python -m pip wheel --no-deps . --wheel-dir wheelhouse
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("wheelhouse").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {
              "csv_to_clonehero/default_config.yaml",
              "csv_to_clonehero/server/templates/base.html",
              "csv_to_clonehero/server/templates/index.html",
              "csv_to_clonehero/server/templates/catalog-player.html",
              "csv_to_clonehero/server/static/catalog.js",
              "csv_to_clonehero/server/static/catalog-audio.js",
              "csv_to_clonehero/server/static/catalog.css",
              "csv_to_clonehero/server/catalog_browse.py",
              "csv_to_clonehero/server/companion_release.py",
              "csv_to_clonehero/server/templates/companion-download.html",
              "csv_to_clonehero/server/static/listening-room.css",
              "csv_to_clonehero/server/static/signal-check.css",
              "csv_to_clonehero/server/releases/manifest.json",
              "csv_to_clonehero/server/releases/riff-companion-2026.10.15-windows-py312-x64.zip",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel is missing package assets: {sorted(missing)}")
          import hashlib
          import json
          with zipfile.ZipFile(wheel) as package:
              root = "csv_to_clonehero/server/releases/"
              manifest = json.loads(package.read(root + "manifest.json"))
              artifact = manifest["artifacts"][0]
              data = package.read(root + artifact["filename"])
              assert len(data) == artifact["size_bytes"]
              assert hashlib.sha256(data).hexdigest() == artifact["sha256"]
          PY
      - name: Offline tests (no live network)
        run: python -m pytest -m "not integration" -q

  container:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag csv-to-clonehero:ci .

  integration:
    name: Live Enchor integration
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'push' && false)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Integration tests (live Enchor, rate-limited)
        run: python -m pytest -m integration -q
      - name: Post status
        run: echo "Integration suite finished"
